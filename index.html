<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>Pfandzählung V3</title>
<style>
/* Grundlage */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: Grunddesign der Pfandzählung V2 (dunkel, blau), Artikel als einfache Liste untereinander; feste Kopierleiste unten. Bewusst nur ein dunkles Design wie V2. */
:root{
  --bg-top:#111827;      /* gray-900 */
  --bg-bottom:#1f2937;   /* gray-800 */
  --head:#030712;        /* gray-950 */
  --card:#1f2937;        /* gray-800 */
  --card-on:#1e2a44;
  --line:#374151;        /* gray-700 */
  --field:#374151;
  --fg:#ffffff;
  --text:#d1d5db;        /* gray-300 */
  --muted:#9ca3af;       /* gray-400 */
  --blue:#3b82f6;        /* blue-500 */
  --blue-btn:#2563eb;    /* blue-600 */
  --blue-dark:#1e40af;   /* blue-800 */
  --blue-text:#60a5fa;   /* blue-400 */
  --green:#16a34a;       /* green-600 */
  --green-line:#22c55e;
  --red:#dc2626;         /* red-600 */
  --gray-btn:#4b5563;    /* gray-600 */
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;background:var(--bg-top)}
body{min-height:100vh;background:linear-gradient(135deg,var(--bg-top),var(--bg-bottom));background-color:var(--bg-top);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--head)}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);border-bottom:2px solid var(--blue);box-shadow:0 10px 15px -3px rgba(0,0,0,.4);
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.head-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px;text-align:center}
h1{margin:0;font-size:1.5rem;font-weight:700}
.by{margin:0;font-size:.75rem;color:var(--muted);margin-top:-4px}
.date{margin:0;font-size:.875rem;font-weight:600;color:var(--blue-text)}
.head-row{display:flex;gap:8px}
.btn{appearance:none;border:0;border-radius:8px;min-height:40px;padding:0 14px;font-weight:600;font-size:.95rem;line-height:1;font-family:inherit;color:#fff;cursor:pointer;touch-action:manipulation}
.btn-red{background:var(--red);flex:1}
.btn-gray{background:var(--gray-btn)}
.btn-gray[aria-pressed="true"]{background:var(--blue-btn)}

.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(110px + env(safe-area-inset-bottom, 0px))}

.item{display:grid;grid-template-columns:minmax(0,1fr) 52px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,.3);transition:background-color .15s,border-color .15s}
.item.has{background:var(--card-on);border-color:var(--blue)}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.round{appearance:none;border:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;line-height:1;font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.round:active{transform:scale(.92)}
.r-blue{background:var(--blue-btn);font-size:.8rem}
.r-green{background:var(--green);font-size:1.25rem}
.r-red{background:var(--red);font-size:1.25rem}
.r-red:disabled{visibility:hidden}

.tap{appearance:none;border:0;margin:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name count" "pic pic";align-items:center;column-gap:10px;row-gap:10px;padding:12px 6px 12px 14px;min-width:0}
.tap:active{background:rgba(255,255,255,.04)}
.name{grid-area:name;min-width:0;font-size:.95rem;font-weight:600;color:var(--text);line-height:1.25;overflow-wrap:anywhere}
.note{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;border:1px solid var(--blue);color:var(--blue-text);font-size:.78rem;font-weight:700;white-space:nowrap;vertical-align:1px}
.count{grid-area:count;font-size:1.75rem;font-weight:700;color:var(--blue-text);font-variant-numeric:tabular-nums;line-height:1;min-width:2ch;text-align:right}
.item:not(.has) .count{color:var(--muted)}
.count.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.2)}}
.tile{grid-area:pic;justify-self:start;display:flex;align-items:center;background:transparent}
.tile img{display:block;width:auto;height:auto;max-width:100%;max-height:112px;border-radius:6px;pointer-events:none;-webkit-user-drag:none}
.tile .emoji{font-size:3.4rem;line-height:1;pointer-events:none}
.nopics .tile{display:none}
.nopics .tap{row-gap:0}

.out{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.out h2{margin:0;font-size:1.1rem;font-weight:700;color:var(--blue-text)}
#preview{display:block;width:100%;box-sizing:border-box;margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:.875rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:none}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-top);border-top:4px solid var(--blue);box-shadow:0 -10px 25px rgba(0,0,0,.5);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.copy{display:block;width:100%;max-width:640px;margin:0 auto;min-height:52px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:1.1rem;line-height:1;font-family:inherit;letter-spacing:.03em;cursor:pointer;touch-action:manipulation;transition:transform .15s}
.copy.done{transform:scale(1.03);background:#15803d}

.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:384px;box-sizing:border-box;background:var(--bg-bottom);border:2px solid var(--blue);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.box.add{border-color:var(--green-line)}
.box.warn{border-color:var(--red)}
.box h3{margin:0;font-size:1.125rem;font-weight:700}
.box p{margin:0;color:var(--text)}
.box p b{color:var(--blue-text)}
.box input{width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--blue);border-radius:8px;background:var(--field);color:#fff;font-weight:700;font-size:1.5rem;line-height:1.2;font-family:inherit;text-align:center}
.box.add input{border-color:var(--green-line)}
.box-btns{display:flex;gap:8px}
.box-btns .btn{flex:1;min-height:48px}
.btn-green{background:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));z-index:30;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;padding:10px 14px;border-radius:8px;background:var(--fg);color:var(--bg-top);font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;z-index:25;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(92px + env(safe-area-inset-bottom, 0px));width:52px;height:52px;border-radius:50%;border:2px solid var(--blue-text);background:var(--blue-btn);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;touch-action:manipulation}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:active{transform:scale(.92)}

.round:focus-visible,.tap:focus-visible,.btn:focus-visible,.copy:focus-visible,.box input:focus-visible{outline:2px solid var(--blue-text);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.count.bump{animation:none}.toast,.copy,.item{transition:none}}
</style>
</head>
<body>
<header class="head">
  <div class="head-in">
    <h1>📦 Pfandzählung V3</h1>
    <p class="by">Webseite bereitgestellt von Nando</p>
    <p id="datum" class="date"></p>
    <div class="head-row">
      <button type="button" id="reset" class="btn btn-red">Alle zurücksetzen</button>
    </div>
  </div>
</header>

<main id="wrap" class="wrap">
  <div id="list" style="display:contents"></div>
  <section class="out" aria-labelledby="out-title">
    <h2 id="out-title">📋 Text zum Kopieren</h2>
    <textarea id="preview" rows="8" readonly aria-label="Text, der kopiert wird"></textarea>
  </section>
</main>

<div class="bar"><button type="button" id="copy" class="copy">📋 COPY</button></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button type="button" id="totop" class="totop" aria-label="Nach oben"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<div id="m-edit" class="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="m-edit-title">
    <h3 id="m-edit-title"></h3>
    <input id="m-edit-input" type="text" inputmode="numeric" pattern="[0-9]*" min="0" aria-label="Neuer Wert">
    <div class="box-btns">
      <button type="button" id="m-edit-ok" class="btn btn-green">✓ Speichern</button>
      <button type="button" class="btn btn-gray" data-close>✕ Abbrechen</button>
    </div>
  </div>
</div>

<div id="m-add" class="modal" hidden>
  <div class="box add" role="dialog" aria-modal="true" aria-labelledby="m-add-title">
    <h3 id="m-add-title"></h3>
    <p>Aktueller Wert: <b id="m-add-cur">0</b></p>
    <input id="m-add-input" type="text" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="Betrag hinzufügen" aria-label="Betrag hinzufügen">
    <div class="box-btns">
      <button type="button" id="m-add-ok" class="btn btn-green">✓ Hinzufügen</button>
      <button type="button" class="btn btn-gray" data-close>✕ Abbrechen</button>
    </div>
  </div>
</div>

<div id="m-reset" class="modal" hidden>
  <div class="box warn" role="dialog" aria-modal="true" aria-labelledby="m-reset-title">
    <h3 id="m-reset-title">⚠️ Alle Werte zurücksetzen?</h3>
    <p>Alle gezählten Werte werden auf 0 zurückgesetzt. Diese Aktion kann nicht rückgängig gemacht werden.</p>
    <div class="box-btns">
      <button type="button" id="m-reset-ok" class="btn btn-red">✓ Zurücksetzen</button>
      <button type="button" class="btn btn-gray" data-close>✕ Abbrechen</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Reihenfolge wie im Sortier-Ordner, danach die weiteren Artikel aus V2.
  // Namen wie in V2 (für den kopierten Text).
  var ITEMS = [
    { n: "Bier 0,33L", img: "img/p-bier-033.png", w: 476, h: 300, note: "24 Flaschen" },
    { n: "Bier 0,5L", img: "img/p-bier-05.png", w: 490, h: 300, note: "20 Flaschen" },
    { n: "Euro 0,33L (Püllecken/Gaffel)", img: "img/p-euro-033.png", w: 522, h: 300, note: "20 Flaschen" },
    { n: "Euro 0,5L (Augustiner/Bayreuther)", img: "img/p-euro-05.png", w: 494, h: 300, note: "20 Flaschen" },
    { n: "Bügel 0,33L", img: "img/p-bugel-033.png", w: 568, h: 300, note: "20 Flaschen" },
    { n: "Bügel 0,5L (Allgäuer/Flensburger)", img: "img/p-bugel-05.png", w: 455, h: 300, note: "20 Flaschen" },
    { n: "Stubbi 0,33L (Bundaberg/Astra)", img: "img/p-stubbi-033.png", w: 613, h: 300, note: "20 Flaschen" },
    { n: "Stubbi 0,5L (Veltins)", img: "img/p-stubbi-05.png", w: 555, h: 300, note: "16 Flaschen" },
    { n: "Maurer 0,5L (Kisten)", img: "img/p-maurer.png", w: 410, h: 300, note: "8 Flaschen" },
    { n: "Schumacher (Kisten)", img: "img/p-schumacher.png", w: 387, h: 300, note: "6 Flaschen" },
    { n: "Einweg Glas (Blaue Faltkiste)", img: "img/p-einweg.png", w: 446, h: 300 },
    { n: "Joghurt (10 Hoch)", img: "img/p-joghurt.png", w: 613, h: 300 },
    { n: "Milch (5 Hoch)", img: "img/p-milch.png", w: 550, h: 300 },
    { n: "Saft 0,7L", img: "img/p-saft-07.png", w: 422, h: 300, note: "6 Flaschen · gelber Streifen" },
    { n: "Saft 1L", img: "img/p-saft-1l.png", w: 409, h: 300, note: "6 Flaschen" },
    { n: "Wasser 0,7/0,75 Glas", img: "img/p-wasser-07.png", w: 426, h: 300, note: "12 Flaschen" },
    { n: "Römerwall 0,7L PET", img: "img/p-romerwall.png", w: 411, h: 300, note: "12 Flaschen" },
    { n: "Wasser 1L PET", img: "img/p-wasser-1l-pet.png", w: 465, h: 300, note: "12 Flaschen" },
    { n: "Charitea/Lemonaid", img: "img/p-charitea.png", w: 643, h: 300, note: "20 Flaschen" },
    { n: "Cola PET 1L", img: "img/p-cola-pet.png", w: 488, h: 300, note: "12 Flaschen" },
    { n: "GDB 1L", img: "img/p-gdb-1l.png", w: 476, h: 300, note: "12 Flaschen" },
    { n: "Mate/FritzCola 0,5L", img: "img/p-mate.png", w: 436, h: 300 },
    { n: "Cola Glas 0,2/0,33L", img: "img/p-cola-02.png", w: 547, h: 300 },
    { n: "Cola Glas 0,5L", img: "img/p-cola-05.png", w: 477, h: 300 },
    { n: "Cola Glas 1L", img: "img/p-cola-1l.png", w: 391, h: 300, note: "6 Flaschen" },
    { n: "Mio Mate 0,5L", img: "img/p-miomate.png", w: 489, h: 300, note: "12 Flaschen" },
    { n: "Gerolsteiner 1L PET", img: "img/p-gerol-1l-pet.png", w: 474, h: 300, note: "12 Flaschen" },
    { n: "Gerolsteiner 0,75 Glas", img: "img/p-gerol-075.png", w: 458, h: 300, note: "12 Flaschen" },
    { n: "Gerolsteiner 1L Glas", img: "img/p-gerol-1l-glas.png", w: 381, h: 300, note: "6 Flaschen" },
    { n: "Gerolsteiner 0,25 Glas", img: "img/p-gerol-025.png", w: 579, h: 300 },
    { n: "TG (Pepsi)", img: "img/p-tg.png", w: 490, h: 300 },
    { n: "Schweppes 1L PET", img: "img/p-schweppes.png", w: 390, h: 300 },
    { n: "GDB 0,5L pet", img: "img/p-gdb-05.png", w: 434, h: 300 },
    { n: "Schweppes 0,2L Glas", img: "img/schweppes-0-2l-glas.jpg", w: 482, h: 200 },
    { n: "Sinalco", img: "img/p-sinalco.png", w: 519, h: 300 },
    { n: "EPS Steigen", img: "img/p-eps.png", w: 538, h: 300 },
    { n: "RC", img: "img/p-rc.png", w: 200, h: 300 },
    { n: "IPT", emoji: "🧊" },
    { n: "RC Divider", img: "img/p-divider2.png", w: 382, h: 240 },
    { n: "Pfandsäcke", img: "img/p-pfandsaecke.png", w: 320, h: 240 },
    { n: "Einwegtalons", emoji: "🎟️" },
    { n: "Dirty bags", emoji: "🗑️" },
    { n: "Clean bags", emoji: "✨" },
    { n: "Müllsäcke", emoji: "🗑️" },
    { n: "Sodastream", emoji: "💨" },
    { n: "Pfandblomben", img: "img/p-plombe.png", w: 643, h: 240 },
    { n: "Palettenbänder", img: "img/p-palettenbaender.png", w: 257, h: 240 },
    { n: "Papierhandtücher", img: "img/p-papier.png", w: 271, h: 240 },
    { n: "Folie Klar", img: "img/p-folieklar.png", w: 241, h: 240 },
    { n: "Folie Schwarz", img: "img/p-folieschwarz.png", w: 239, h: 240 }
  ];
  // Ohne Zählung steht beim Kopieren überall 0
  var DEFAULTS = {};

  var KEY = "pfandzaehlung.v3";
  var MAX_AGE = 6 * 60 * 60 * 1000; // wie V2: nach 6 Stunden verwerfen
  var state = { counts: {}, pics: true, ts: 0 };
  var rows = [];
  var current = null;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function today() { var d = new Date(); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); }

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!raw || typeof raw !== "object") return;
      state.pics = raw.pics !== false;
      if (raw.ts && Date.now() - raw.ts < MAX_AGE && raw.counts && typeof raw.counts === "object") {
        Object.keys(raw.counts).forEach(function (k) {
          var n = Math.floor(Number(raw.counts[k]));
          if (n > 0 && n < 1000000) state.counts[k] = n;
        });
        state.ts = raw.ts;
      }
    } catch (e) {}
  }
  function save(touch) {
    if (touch) state.ts = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }

  function button(cls, label, text) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "round " + cls; b.textContent = text;
    b.setAttribute("aria-label", label);
    return b;
  }

  function build() {
    var list = $("list");
    ITEMS.forEach(function (def) {
      var r = { name: def.n };
      var item = document.createElement("div");
      item.className = "item";

      var minus = button("r-red", def.n + ": eins abziehen", "−");

      var tap = document.createElement("button");
      tap.type = "button"; tap.className = "tap";
      var nm = document.createElement("span"); nm.className = "name"; nm.textContent = def.n;
      if (def.note) { var no = document.createElement("span"); no.className = "note"; no.textContent = def.note; nm.appendChild(no); }
      var ct = document.createElement("span"); ct.className = "count"; ct.setAttribute("aria-hidden", "true");
      ct.addEventListener("animationend", function () { ct.classList.remove("bump"); });
      var tile = document.createElement("span"); tile.className = "tile";
      if (def.img) {
        var img = document.createElement("img");
        img.alt = ""; img.width = def.w; img.height = def.h; img.decoding = "async"; img.draggable = false;
        img.addEventListener("error", function () { img.remove(); });
        img.src = def.img;
        tile.appendChild(img);
      } else {
        var em = document.createElement("span"); em.className = "emoji"; em.textContent = def.emoji;
        tile.appendChild(em);
      }
      tap.appendChild(nm); tap.appendChild(ct); tap.appendChild(tile);

      var right = document.createElement("div");
      right.className = "side";
      var edit = button("r-blue", def.n + ": Wert bearbeiten", "E");
      var plus = button("r-green", def.n + ": Menge hinzufügen", "+");
      right.appendChild(edit); right.appendChild(plus); right.appendChild(minus);

      item.appendChild(tap); item.appendChild(right);
      list.appendChild(item);

      r.item = item; r.minus = minus; r.tap = tap; r.ct = ct;
      tap.addEventListener("click", function () { setCount(r, get(r) + 1); buzz(); });
      minus.addEventListener("click", function () { setCount(r, get(r) - 1); });
      edit.addEventListener("click", function () { openEdit(r); });
      plus.addEventListener("click", function () { openAdd(r); });
      rows.push(r);
    });
  }

  function get(r) { return state.counts[r.name] || 0; }
  function paint(r) {
    var n = get(r);
    r.ct.textContent = n;
    r.item.classList.toggle("has", n > 0);
    r.minus.disabled = n === 0;
    r.tap.setAttribute("aria-label", r.name + ": " + n + ". Antippen zählt eins dazu.");
  }
  function setCount(r, next) {
    next = Math.max(0, Math.floor(next) || 0);
    var cur = get(r);
    if (next === cur) return;
    if (next) state.counts[r.name] = next; else delete state.counts[r.name];
    save(true);
    paint(r);
    if (next > cur) { r.ct.classList.remove("bump"); void r.ct.offsetWidth; r.ct.classList.add("bump"); }
    summary();
  }

  // Kopiertext wie in der Pfandzählung V2
  function text() {
    return "Pfandzählung vom: " + today() + "\n\n" + rows.map(function (r) {
      var v = get(r);
      return r.name + ": " + (v === 0 && DEFAULTS[r.name] ? DEFAULTS[r.name] : v);
    }).join("\n");
  }
  function summary() { $("preview").value = text(); }

  // Dialoge wie in V2
  function open(id, input) {
    $(id).hidden = false;
    if (input) {
      // Direkt im Tipp fokussieren, sonst öffnet iOS die Zahlentastatur nicht
      try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
      setTimeout(function () { try { input.setSelectionRange(0, input.value.length); } catch (e) { try { input.select(); } catch (e2) {} } }, 30);
    }
  }
  function closeAll() { ["m-edit", "m-add", "m-reset"].forEach(function (id) { $(id).hidden = true; }); current = null; }
  function num(v) { var n = parseInt(v, 10); return isNaN(n) ? null : n; }

  function openEdit(r) {
    current = r;
    $("m-edit-title").textContent = r.name;
    $("m-edit-input").value = get(r);
    open("m-edit", $("m-edit-input"));
  }
  function saveEdit() {
    var v = num($("m-edit-input").value);
    if (current && v !== null) setCount(current, v);
    closeAll();
  }
  function openAdd(r) {
    current = r;
    $("m-add-title").textContent = r.name;
    $("m-add-cur").textContent = get(r);
    $("m-add-input").value = "";
    open("m-add", $("m-add-input"));
  }
  function saveAdd() {
    var v = num($("m-add-input").value);
    if (current && v !== null) setCount(current, get(current) + v);
    closeAll();
  }

  $("m-edit-ok").addEventListener("click", saveEdit);
  $("m-add-ok").addEventListener("click", saveAdd);
  $("m-edit-input").addEventListener("keydown", function (e) { if (e.key === "Enter") saveEdit(); });
  $("m-add-input").addEventListener("keydown", function (e) { if (e.key === "Enter") saveAdd(); });
  $("reset").addEventListener("click", function () { open("m-reset"); });
  $("m-reset-ok").addEventListener("click", function () {
    state.counts = {}; save(true); rows.forEach(paint); summary(); closeAll();
  });
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeAll); });
  document.querySelectorAll(".modal").forEach(function (m) { m.addEventListener("click", function (e) { if (e.target === m) closeAll(); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });

  // Bilder ein- und ausblenden

  // Kopieren
  var toastTimer, copyTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 4000);
  }
  function copied() {
    var b = $("copy"); b.textContent = "✔ Kopiert"; b.classList.add("done");
    clearTimeout(copyTimer); copyTimer = setTimeout(function () { b.textContent = "📋 COPY"; b.classList.remove("done"); }, 1200);
  }
  function fallbackCopy(t) {
    var pv = $("preview"), ok = false;
    pv.value = t;
    try { pv.focus({ preventScroll: true }); pv.select(); pv.setSelectionRange(0, t.length); ok = document.execCommand("copy"); } catch (e) {}
    if (ok) { pv.blur(); copied(); return; }
    pv.scrollIntoView({ block: "center", behavior: "smooth" });
    toast("Automatisch kopieren ging nicht. Der Text unten ist markiert.");
  }
  $("copy").addEventListener("click", function () {
    var t = text();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(copied, function () { fallbackCopy(t); });
    else fallbackCopy(t);
  });

  document.addEventListener("touchstart", function () {}, { passive: true });

  // Nach-oben-Knopf
  var totop = $("totop");
  function checkTop() { totop.classList.toggle("show", window.scrollY > 400); }
  window.addEventListener("scroll", checkTop, { passive: true });
  totop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  checkTop();

  load();
  build();
  $("datum").textContent = "Pfandzählung vom: " + today();
  rows.forEach(paint);
  summary();
})();
</script>
</body>
</html>
